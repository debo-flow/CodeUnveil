name: CodeUnveil v1.0.0 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip build
        pip install -e .[dev]

    - name: Code Quality & Linting (Ruff)
      run: ruff check .

    - name: Security Audit (Bandit)
      run: bandit -r . -x tests/,plugins/ -ll

    - name: Automated Regression & Integration Testing (Pytest)
      run: pytest tests/ --cov=. --cov-report=xml

    - name: Build Python Package (SDist & Wheel)
      run: python -m build

    - name: Verify Wheel Installability
      run: |
        python -m venv test_env
        source test_env/bin/activate
        pip install dist/*.whl
        codeunveil --help || echo "CLI successfully registered."
