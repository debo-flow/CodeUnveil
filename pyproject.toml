[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["plugins/templates/*", ".git", "__pycache__", "venv"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
